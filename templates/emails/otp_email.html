<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; margin: 20px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <tr>
            <td align="center" style="padding-bottom: 20px;">
                <h2 style="color: #333333; margin: 0;">Підтвердження акаунту</h2>
            </td>
        </tr>
        <tr>
            <td style="color: #555555; font-size: 16px; line-height: 1.5; padding-bottom: 20px;">
                Привіт! Ви запросили код підтвердження для доступу до вашого акаунту. Будь ласка, використайте наступний одноразовий код. Він дійсний протягом 5 хвилин.
            </td>
        </tr>
        <tr>
            <td align="center" style="padding: 20px 0;">
                <span style="font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #4A90E2; background-color: #F0F4F8; padding: 12px 25px; border-radius: 4px; border: 1px dashed #4A90E2;">
                    {{ otp_code }}
                </span>
            </td>
        </tr>
        <tr>
            <td style="color: #999999; font-size: 12px; text-align: center; padding-top: 30px; border-top: 1px solid #eeeeee;">
                Якщо ви не надсилали цей запит, просто проігноруйте цей лист.
            </td>
        </tr>
    </table>
</body>
</html>
