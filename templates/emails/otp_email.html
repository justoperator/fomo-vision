<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your FOMO Studio account</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f4;font-family:Arial,sans-serif;color:#333">
  <table role="presentation" width="100%" style="max-width:600px;margin:auto;background:#fff;border-radius:8px">
    <tr>
      <td style="padding:32px">
        <h1 style="margin:0 0 16px;font-size:24px">Confirm your account</h1>
        <p style="font-size:16px;line-height:1.5">
          Use this code to finish creating your FOMO Studio account. It is valid for 5 minutes.
        </p>
        <p style="margin:28px 0;text-align:center">
          <strong style="display:inline-block;padding:14px 24px;border:1px dashed #4A90E2;border-radius:4px;background:#F0F4F8;color:#4A90E2;font-size:32px;letter-spacing:6px">
            {{ otp_code }}
          </strong>
        </p>
        <p style="border-top:1px solid #eee;padding-top:20px;color:#777;font-size:12px">
          If you did not request this code, you can ignore this email.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
